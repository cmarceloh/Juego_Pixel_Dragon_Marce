<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Dragon Marce – Juego de plataformas 2D. ¡Mata dragones, zombies y soldados, recoge monedas y conquista los 20 niveles!">
  <title>⚔ Dragon Marce ⚔</title>
  <style>
    /* ── Reset y base ── */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #06010F;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* ── Barra superior para PC ── */
    #topBar {
      width: min(960px, 96vw);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding: 0 4px;
      transition: opacity 0.2s;
    }

    #pageTitle {
      color: #FFD700;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 0 10px #FF8800;
      opacity: 0.95;
    }

    #btnFullscreen {
      background: rgba(102, 0, 153, 0.55);
      border: 1px solid #9900FF;
      color: #00FF88;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(153, 0, 255, 0.4);
    }
    #btnFullscreen:hover {
      background: rgba(153, 0, 255, 0.85);
      color: #FFFFFF;
      box-shadow: 0 0 16px rgba(0, 255, 136, 0.8);
      transform: scale(1.04);
    }
    #btnFullscreen:active { transform: scale(0.96); }

    /* ── Contenedor principal ── */
    #wrapper {
      position: relative;
      width: min(960px, 96vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* ── Canvas del juego ── */
    #gameCanvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      max-height: 74vh;
      object-fit: contain;
      border: 3px solid #550088;
      box-shadow:
        0 0 0 1px #330066,
        0 0 24px #8800FF55,
        0 0 50px #44008822,
        inset 0 0 30px #00000044;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;
      cursor: default;
    }

    /* ── Controles flotantes en pantalla para móviles ── */
    #touchOverlay {
      display: none;
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      justify-content: space-between;
      align-items: flex-end;
      padding: 12px 18px;
    }

    .touch-pad {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .touch-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      background: rgba(20, 10, 35, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #FFFFFF;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6), inset 0 0 8px rgba(255, 255, 255, 0.2);
      transition: transform 0.06s, background 0.08s, border-color 0.08s;
    }

    .touch-btn:active, .touch-btn.active {
      transform: scale(0.90);
      background: rgba(255, 255, 255, 0.35);
      border-color: #00FF88;
      box-shadow: 0 0 16px rgba(0, 255, 136, 0.8);
    }

    /* Estilos individuales de botones */
    #btnLeft, #btnRight {
      width: 62px; height: 62px;
      border-color: rgba(180, 140, 255, 0.6);
      background: rgba(45, 15, 75, 0.7);
    }

    #btnBomb {
      width: 58px; height: 58px;
      border-color: rgba(255, 170, 0, 0.7);
      background: rgba(90, 50, 0, 0.7);
      font-size: 22px;
    }

    #btnAttack {
      width: 62px; height: 62px;
      border-color: rgba(255, 80, 80, 0.7);
      background: rgba(90, 20, 20, 0.7);
      font-size: 24px;
    }

    #btnJump {
      width: 72px; height: 72px;
      border-color: rgba(0, 220, 255, 0.8);
      background: rgba(0, 70, 100, 0.75);
      font-size: 28px;
      font-weight: bold;
      color: #00E5FF;
    }

    /* Botones utilitarios de esquina superior para móvil */
    #touchTopBar {
      display: none;
      position: absolute;
      top: 8px;
      right: 12px;
      gap: 8px;
      pointer-events: auto;
      z-index: 60;
    }

    .btn-util {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.6);
      color: #FFD700;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Aviso de rotación de pantalla */
    #rotateNotice {
      display: none;
      color: #FFAA00;
      font-size: 11px;
      margin-top: 4px;
      text-align: center;
      animation: pulseNotice 2s infinite ease-in-out;
    }
    @keyframes pulseNotice { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }

    /* ── Pie de página para PC ── */
    #footer {
      margin-top: 8px;
      color: #777788;
      font-size: 11px;
      text-align: center;
      letter-spacing: 0.5px;
    }
    #footer span { color: #AA88EE; font-weight: bold; }

    #copyright {
      margin-top: 6px;
      text-align: center;
      font-size: 11px;
      color: #886699;
      letter-spacing: 0.5px;
    }

    /* ══════════════════════════════════════════════════════════
       ADAPTACIÓN RESPONSIVA Y MÓVIL TOTAL
       ══════════════════════════════════════════════════════════ */

    /* Modo Móvil / Pantallas táctiles */
    @media (hover: none) and (pointer: coarse), (max-width: 900px) {
      body {
        justify-content: center;
        padding: 0;
        margin: 0;
        background: #000;
      }
      #topBar { display: none; }
      #footer { display: none; }
      #copyright { display: none; }
      #touchOverlay { display: flex; }
      #touchTopBar { display: flex; }

      #wrapper {
        width: 100vw;
        height: 100vh;
        max-width: 100vw;
        max-height: 100vh;
        border: none;
        position: fixed;
        inset: 0;
        background: #000;
      }

      #gameCanvas {
        width: 100vw;
        height: 56.25vw;
        max-width: 177.78vh;
        max-height: 100vh;
        border: none;
        box-shadow: none;
        margin: auto;
      }
    }

    /* Modo Horizontal en Móvil (Landscape) */
    @media (orientation: landscape) and (max-height: 600px) {
      #rotateNotice { display: none !important; }
      #wrapper {
        width: 100vw !important;
        height: 100vh !important;
      }
      #gameCanvas {
        width: 100vw !important;
        height: 100vh !important;
        max-width: 177.78vh !important;
        max-height: 100vh !important;
        object-fit: contain !important;
      }
      #touchOverlay {
        padding: 10px 24px 14px 24px;
      }
    }

    /* Modo Vertical en Móvil (Portrait) */
    @media (orientation: portrait) and (max-width: 600px) {
      #rotateNotice { display: block; }
      #wrapper {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      #gameCanvas {
        width: 100vw;
        height: 56.25vw;
        margin-top: 20px;
      }
      #touchOverlay {
        position: relative;
        inset: auto;
        width: 100vw;
        padding: 20px 16px 30px 16px;
        background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(10,5,20,0.95) 100%);
      }
    }

    /* Modo Pantalla Completa en PC */
    body.fullscreen-active #topBar,
    body.fullscreen-active #footer,
    body.fullscreen-active #copyright {
      display: none !important;
    }
    body.fullscreen-active #wrapper {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      background: #000 !important;
      margin: 0 !important;
      padding: 0 !important;
      z-index: 999999 !important;
    }
    body.fullscreen-active #gameCanvas {
      width: 100vw !important;
      height: 56.25vw !important;
      max-width: 177.78vh !important;
      max-height: 100vh !important;
      border: none !important;
      box-shadow: none !important;
      object-fit: contain !important;
      margin: auto !important;
    }
  </style>
</head>
<body>

  <div id="topBar">
    <div id="pageTitle">&#9876; Dragon Marce &#9876;</div>
    <button id="btnFullscreen" title="Alternar Pantalla Completa (Tecla F)">&#9974; Pantalla Completa [F]</button>
  </div>

  <div id="wrapper">
    <canvas id="gameCanvas" width="800" height="450" tabindex="0" aria-label="Dragon Marce - Juego de plataformas 2D"></canvas>

    <!-- Botones utilitarios superiores en móvil -->
    <div id="touchTopBar">
      <button class="btn-util" id="btnTouchFs" title="Pantalla Completa">&#9974;</button>
      <button class="btn-util" id="btnTouchMute" title="Silenciar Sonido">&#128266;</button>
    </div>

    <!-- Controles táctiles superpuestos ergonómicos -->
    <div id="touchOverlay" role="group" aria-label="Controles táctiles del juego">
      <!-- Lado Izquierdo: Movimiento -->
      <div class="touch-pad" id="touchLeft">
        <button class="touch-btn" id="btnLeft" aria-label="Mover a la izquierda">&#9664;</button>
        <button class="touch-btn" id="btnRight" aria-label="Mover a la derecha">&#9654;</button>
      </div>

      <!-- Lado Derecho: Acciones y Salto -->
      <div class="touch-pad" id="touchRight">
        <button class="touch-btn" id="btnBomb" aria-label="Tirar Bomba Explosiva">&#128163;</button>
        <button class="touch-btn" id="btnAttack" aria-label="Lanzar Hacha">&#129683;</button>
        <button class="touch-btn" id="btnJump" aria-label="Saltar">&#9650;</button>
      </div>
    </div>
  </div>

  <div id="rotateNotice">&#128260; Gira el móvil en horizontal para jugar a pantalla completa</div>

  <div id="footer">
    <span>&larr;&rarr; / A D</span> Mover &nbsp;|&nbsp;
    <span>&uarr; / W / Espacio</span> Saltar (doble salto) &nbsp;|&nbsp;
    <span>Z / X</span> Lanzar hacha &nbsp;|&nbsp;
    <span>C</span> Tirar Bomba &#128163; &nbsp;|&nbsp;
    <span>F</span> Pantalla Completa &nbsp;|&nbsp;
    <span>ESC</span> Pausa &nbsp;|&nbsp;
    <span>M</span> Silenciar
  </div>

  <!-- Scripts del juego (orden importante) -->
  <script src="assets/sounds.js?v=2026_mobile"></script>

</body>
